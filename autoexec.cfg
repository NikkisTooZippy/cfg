unbindall 
bind "mouse_x" "yaw" 
bind "mouse_y" "pitch"
sensitivity "0.9"
bind "MOUSE1" "+attack"
bind "MOUSE2" "+attack2"
bind "mwheeldown" "+jump"
bind "mwheelup" "+jump"
bind "mouse4" "+voicerecord"

////KEYBOARD

//BUY

bind "ctrl" "buymenu"

//SAYBINDS

bind "j" "say ПНХ"
bind "k" "say ♿"
bind "l" "say HEJSAN RÖVHÅL :PPppPpp"
bind "p" "say smoked"
bind "i" "say you playing chess im playing checkers"
bind "o" "say bind p say smoked"


//DIRECTIONAL

bind "w" "+forward"
bind "s" "+back"
bind "a" "+left"
bind "d" "+right"
bind "space" "+duck"
bind "shift" "+sprint"
bind "alt" "+jump"

//INTERACT/SELECT

bind "r" "+reload"
bind "e" "+use"
bind "g" "drop"
bind "q" "lastinv"
bind "1" "slot1"
bind "2" "slot2"
bind "3" "slot3"
bind "4" "slot4"
bind "5" "slot5"
bind "6" "slot6"
bind "7" "slot7"
bind "8" "slot8"
bind "9" "slot9"
bind "0" "slot10"
bind "t" "+lookatweapon"
bind "u" "say_team"
bind "y" "say"
bind "v" "switchhands"
bind "x" "slot12"
bind "f" "+spray_menu"
bind "`" "nohud"
bind "f3" "toggle cl_dm_buyrandomweapons" // kinda sucks cause ui doesn't show keybind

//VIEWMODEL

cl_prefer_lefthanded "0"
viewmodel_fov "68"
viewmodel_offset_x "2.5"
viewmodel_offset_y "2"
viewmodel_offset_z "-2"

//CROSSHAIR         https://cs2-crosshair-decoder.vercel.app/

cl_crosshairgap "-0.9"
cl_crosshair_outlinethickness "0"
cl_crosshaircolor_r "0"
cl_crosshaircolor_g "255"
cl_crosshaircolor_b "0"
cl_crosshairalpha "255"
cl_crosshair_dynamic_splitdist "7"
cl_crosshair_recoil "false"
cl_fixedcrosshairgap "3"
cl_crosshair_drawoutline "0"
cl_crosshair_dynamic_splitalpha_innermod "1"
cl_crosshair_dynamic_splitalpha_outermod "0.5"
cl_crosshair_dynamic_maxdist_splitratio "0.3"
cl_crosshairthickness "0.1"
cl_crosshairdot "0"
cl_crosshairgap_useweaponvalue "0"
cl_crosshairusealpha "1"
cl_crosshair_t "0"
cl_crosshairstyle "4"
cl_crosshairsize "3.5"

//HUD

bind "tab" +showscores
cl_use_opens_buy_menu 0
cl_showloadout 1
sv_steamgroup 1
cl_hud_radar_scale "0.9"
cl_radar_scale "0.4"
cl_radar_always_centered "0"
bind \ "toggleconsole"
r_fullscreen_gamma "3"
cl_teamid_overhead_mode "1"

//this makes the radar background solid black and disables the expensive blur behind it.
cl_hud_radar_blur_background "0"
cl_hud_radar_background_alpha "1"

//ALIASES

alias dc "disconnect"
alias nohud "toggle cl_draw_only_deathnotices"
alias exit "toggleconsole"

//VOICE

snd_voipvolume "2"
snd_mvp_volume "0"
voice_loopback "0"

//SOUND

volume ".35"
bind z "incrementvar volume 0 .35 .35"
snd_tensecondwarning_volume ".03"
snd_menumusic_volume "0"
snd_roundend_volume "0.02"
snd_roundstart_volume "0"
snd_deathcamera_volume "0"
snd_mapobjective_volume "0"
snd_roundstart_volume "0"
snd_roundend_volume "0"
snd_deathcamera_volume "0"
snd_headphone_eq "2" // 1 = sharp 2 = smooth 0 = natural
snd_spatialize_lerp "1"
snd_steamaudio_enable_perspective_correction "0"
snd_mute_losefocus "0" // no mute on focus loss

//OTHER

cl_color "3"
cl_invites_only_friends "1" // stops all those shitty bots that spam invites
cl_weapon_selection_rarity_color "1"
safezonex "0.8"
cl_teammate_colors_show "2"
cl_sniper_show_inaccuracy "0"
cl_teamcounter_playercount_instead_of_avatars "1"
cl_hud_color "5"
r_show_build_info "0"
r_drawtracers_firstperson "0"
cl_net_buffer_ticks "0"
joystick "0"
mm_dedicated_search_maxping "350"
fps_max "0"
host_writeconfig
